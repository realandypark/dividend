<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dividend Growth Simulator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.0/chart.min.js"></script>
    <style>
        :root {
            --background: #131722;
            --surface: #1e222d;
            --surface-light: #2a2e39;
            --primary: #e8933a;
            --primary-light: #ffa94d;
            --primary-dark: #d17f2f;
            --accent: #26a69a;
            --text: #d1d4dc;
            --text-secondary: #787b86;
            --border: #363a45;
            --chart-grid: #363a45;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--background);
            color: var(--text);
            line-height: 1.5;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
        }

        .sidebar {
            background-color: var(--surface);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            background-color: var(--surface);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        
        h1 {
            color: var(--primary);
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        h2 {
            color: var(--primary);
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 15px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text);
            font-size: 0.9rem;
        }
        
        input[type="number"] {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background-color: var(--surface-light);
            color: var(--text);
            font-size: 0.9rem;
        }
        
        input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        input[type="checkbox"] {
            accent-color: var(--primary);
            margin-right: 8px;
        }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .metric-card {
            background-color: var(--surface);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .metric-label {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 5px;
        }

        .metric-value {
            color: var(--primary);
            font-size: 1.2rem;
            font-weight: 600;
        }

        .charts-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        
        .chart-wrapper {
            background-color: var(--surface);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .main-chart {
            height: 400px;
        }

        .sub-charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .sub-chart {
            height: 300px;
        }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h2>Input Parameters</h2>
            <div class="input-group">
                <label for="sharePrice">Current Share Price ($)</label>
                <input type="number" id="sharePrice" step="0.01" value="100">
            </div>
            
            <div class="input-group">
                <label for="currentDividend">Annual Dividend Per Share ($)</label>
                <input type="number" id="currentDividend" step="0.01" value="2">
            </div>
            
            <div class="input-group">
                <label for="growthRate">Dividend Growth Rate (% / year)</label>
                <input type="number" id="growthRate" step="0.1" value="5">
            </div>
            
            <div class="input-group">
                <label>
                    <input type="checkbox" id="reinvestDividends">
                    Reinvest Dividends
                </label>
            </div>
        </aside>

        <main class="main-content">
            <header class="header">
                <h1>Dividend Growth Simulator by Andy Park</h1>
            </header>

            <section class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-label">Current Yield</div>
                    <div class="metric-value"><span id="currentYield">2.00%</span></div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Payback Period</div>
                    <div class="metric-value"><span id="paybackPeriod">0</span> years</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Future Annual Dividend</div>
                    <div class="metric-value">$<span id="futureDividend">0.00</span></div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Total Dividends (10Y)</div>
                    <div class="metric-value">$<span id="totalDividends">0.00</span></div>
                </div>
            </section>

            <section class="charts-container">
                <div class="chart-wrapper main-chart">
                    <canvas id="dividendChart"></canvas>
                </div>
                <div class="sub-charts">
                    <div class="chart-wrapper sub-chart">
                        <canvas id="paybackChart"></canvas>
                    </div>
                    <div class="chart-wrapper sub-chart">
                        <canvas id="yieldChart"></canvas>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        let dividendChart, paybackChart, yieldChart;
        
        const chartColors = {
            primary: '#e8933a',
            secondary: '#26a69a',
            tertiary: '#78909c'
        };
        
        function calculateDividends() {
            const sharePrice = parseFloat(document.getElementById('sharePrice').value);
            const currentDividend = parseFloat(document.getElementById('currentDividend').value);
            const growthRate = parseFloat(document.getElementById('growthRate').value) / 100;
            const reinvestDividends = document.getElementById('reinvestDividends').checked;
            
            const currentYield = (currentDividend / sharePrice) * 100;
            document.getElementById('currentYield').textContent = currentYield.toFixed(2) + '%';
            
            const years = Array.from({length: 11}, (_, i) => i);
            let annualDividends = [];
            let cumulativeDividends = [];
            let yields = [];
            let shares = 1;
            let totalDividends = 0;
            
            years.forEach(year => {
                const yearlyDividend = currentDividend * Math.pow(1 + growthRate, year);
                if (reinvestDividends && year > 0) {
                    const newShares = (yearlyDividend * shares) / sharePrice;
                    shares += newShares;
                    const yearTotal = yearlyDividend * shares;
                    totalDividends += yearTotal;
                    annualDividends.push(yearTotal);
                    yields.push((yearlyDividend / sharePrice) * 100);
                } else {
                    totalDividends += yearlyDividend;
                    annualDividends.push(yearlyDividend);
                    yields.push((yearlyDividend / sharePrice) * 100);
                }
                cumulativeDividends.push(totalDividends);
            });
            
            const paybackYear = cumulativeDividends.findIndex(amount => amount >= sharePrice);
            document.getElementById('paybackPeriod').textContent = 
                paybackYear >= 0 ? paybackYear : '>10';
            
            const finalDividend = annualDividends[annualDividends.length - 1];
            document.getElementById('futureDividend').textContent = finalDividend.toFixed(2);
            document.getElementById('totalDividends').textContent = totalDividends.toFixed(2);
            
            updateCharts(years, annualDividends, cumulativeDividends, yields);
        }
        
        function updateCharts(years, dividends, cumulative, yields) {
            const commonOptions = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        labels: { color: '#d1d4dc' }
                    },
                    title: {
                        color: '#d1d4dc',
                        font: { size: 14 }
                    }
                },
                scales: {
                    x: {
                        grid: { color: '#363a45' },
                        ticks: { color: '#d1d4dc' }
                    },
                    y: {
                        grid: { color: '#363a45' },
                        ticks: { color: '#d1d4dc' }
                    }
                },
                elements: {
                    line: {
                        tension: 0.3,
                        borderWidth: 2
                    },
                    point: {
                        radius: 3,
                        hoverRadius: 5
                    }
                }
            };

            const ctx1 = document.getElementById('dividendChart').getContext('2d');
            if (dividendChart) dividendChart.destroy();
            dividendChart = new Chart(ctx1, {
                type: 'line',
                data: {
                    labels: years.map(year => `Year ${year}`),
                    datasets: [{
                        label: 'Annual Dividend',
                        data: dividends,
                        borderColor: chartColors.primary,
                        backgroundColor: chartColors.primary + '20'
                    }]
                },
                options: {
                    ...commonOptions,
                    plugins: {
                        ...commonOptions.plugins,
                        title: {
                            display: true,
                            text: 'Projected Dividend Growth'
                        }
                    }
                }
            });

            const ctx2 = document.getElementById('paybackChart').getContext('2d');
            if (paybackChart) paybackChart.destroy();
            paybackChart = new Chart(ctx2, {
                type: 'line',
                data: {
                    labels: years.map(year => `Year ${year}`),
                    datasets: [{
                        label: 'Cumulative Dividends',
                        data: cumulative,
                        borderColor: chartColors.secondary,
                        backgroundColor: chartColors.secondary + '20'
                    }]
                },
                options: {
                    ...commonOptions,
                    plugins: {
                        ...commonOptions.plugins,
                        title: {
                            display: true,
                            text: 'Investment Payback Period'
                        }
                    }
                }
            });

            const ctx3 = document.getElementById('yieldChart').getContext('2d');
            if (yieldChart) yieldChart.destroy();
            yieldChart = new Chart(ctx3, {
                type: 'line',
                data: {
                    labels: years.map(year => `Year ${year}`),
                    datasets: [{
                        label: 'Yield on Cost',
                        data: yields,
                        borderColor: chartColors.tertiary,
                        backgroundColor: chartColors.tertiary + '20'
                    }]
                },
                options: {
                    ...commonOptions,
                    plugins: {
                        ...commonOptions.plugins,
                        title: {
                            display: true,
                            text: 'Projected Yield on Cost'
                        }
                    },
                    scales: {
                        ...commonOptions.scales,
                        y: {
                            ...commonOptions.scales.y,
                            ticks: {
                                callback: value => value + '%',
                                color: '#d1d4dc'
                            }
                        }
                    }
                }
            });
        }
        
        document.getElementById('sharePrice').addEventListener('input', calculateDividends);
        document.getElementById('currentDividend').addEventListener('input', calculateDividends);
        document.getElementById('growthRate').addEventListener('input', calculateDividends);
        document.getElementById('reinvestDividends').addEventListener('change', calculateDividends);
        
        calculateDividends();
    </script>
</body>
</html>
